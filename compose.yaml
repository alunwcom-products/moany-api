services:
  moany-db:
    image: mariadb:lts
    container_name: moany-node-db
    restart: unless-stopped
    env_file:
      - .env.compose
    environment:
      #MARIADB_ROOT_PASSWORD: <env_file>
      MARIADB_DATABASE: moany
      MARIADB_USER: moany
      #MARIADB_PASSWORD: <env_file>
      MARIADB_AUTO_UPGRADE: true
      MARIADB_DISABLE_UPGRADE_BACKUP: true
    ports:
      # Format: [HOST_IP]:[HOST_PORT]:[CONTAINER_PORT]
      - "127.0.0.1:3316:3306"
    networks:
      - moany-net
    volumes:
      - /srv/apps/moany-node-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  moany-api:
    image: alunwcom/moany-api:latest
    container_name: moany-node-api
    ports:
      # Format: [HOST_IP]:[HOST_PORT]:[CONTAINER_PORT]
      - "127.0.0.1:9080:3000"
    networks:
      - moany-net
    env_file:
      - .env.compose
    environment:
      DB_HOST: moany-db
      DB_PORT: 3306
      DB_USER: moany
      #DB_PASSWORD: <env_file>
      DB_NAME: moany
      #JWT_SECRET: <env_file>
      #JWT_EXPIRY: <env_file>
      FRONT_END_HOSTNAME: https://moany3.alunw.com
      NODE_ENV: test
      EXPRESS_PORT: 3000
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MINUTES: 15
      RATE_LIMIT_REQUESTS: 100
    restart: unless-stopped
    volumes:
      - /srv/apps/moany-node-api:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  moany-net:
    driver: bridge
    name: moany-api-net

